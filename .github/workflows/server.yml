name: AllMusic Server

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:    
      - 'releases/**'
      - 'main'
    # Sequence of patterns matched against refs/tags
    tags:        
      - '*'

jobs:
  build_all:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3 # v3.1.0
    - name: build
      shell: cmd
      run: |
        gradlew :server:build :server:paper:build :server:spigot:build :server:velocity:build :server:folia:build --stacktrace --info
    - name: upload build reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: |
          **/build/reports/
          **/build/test-results/
        retention-days: 7
    - name: update
      if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'debug')
      uses: actions/upload-artifact@v4
      with:
        name: "allmusic_server"
        path: build/
